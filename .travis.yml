dist: noble
language: python
python:
  - "3.14"

install:
  - python -m pip install uv
  - uv sync

script:
  - uv run black --check .
  - uv run flake8
  - uv run coverage run manage.py test
  - uv run coveralls

deploy:
  provider: elasticbeanstalk
  access_key_id: '$AWS_ACCESS_KEY_ID'
  secret_access_key: '$AWS_SECRET_ACCESS_KEY'
  region: us-east-1
  app: swe-ae3144
  bucket: elasticbeanstalk-us-east-1-992382631724